<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom 100x</title>
    <style>
        body { 
            background-color: #121212; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { 
            text-align: center; 
            color: #ff4757; 
            font-size: 2.8rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 25px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        .card { 
            background: #1e1e1e; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.4); 
            transition: transform 0.2s, border-color 0.2s; 
            text-decoration: none; 
            color: white; 
            text-align: center; 
            border: 2px solid #2e2e2e; 
        }
        .card:hover { 
            transform: translateY(-5px); 
            border-color: #ff4757; 
        }
        .card img { 
            width: 100%; 
            height: 140px; 
            object-fit: cover; 
        }
        .card p { 
            padding: 12px; 
            margin: 0; 
            font-weight: bold; 
            font-size: 1rem; 
        }
    </style>
</head>
<body>

    <h1>CLASSROOM 100X</h1>
    
    <div class="grid">
        <!-- GAME 1 TILE -->
        <a href="slope.html" class="card">
            <img src="https://unsplash.com" alt="Slope">
            <p>Slope Game</p>
        </a>
        
        <!-- GAME 2 TILE -->
        <a href="retro-bowl.html" class="card">
            <img src="https://unsplash.com" alt="Retro Bowl">
            <p>Retro Bowl</p>
        </a>
    </div>

</body>
</html>
