<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slope Game - Classroom 100x</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        .nav-bar {
            background-color: #1a1a1a;
            padding: 10px 20px;
            display: flex;
            align-items: center;
        }
        .back-btn {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            background: #ff4757;
            padding: 8px 16px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: #ff6b81;
        }
        iframe {
            width: 100%;
            height: calc(100vh - 56px);
            border: none;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">⬅ Back to Arcade</a>
    </div>

    <!-- This pulls a clean, active web version of Slope -->
    <iframe src="https://googleusercontent.com"></iframe>

</body>
</html>
